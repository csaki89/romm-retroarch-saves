; Template: @USER@ and @HOME@ are filled in by packaging/init.d/50-romm-sync.sh
[program:romm-retroarch-watch]
command=@HOME@/.venvs/romm-sync/bin/romm-sync watch
directory=@HOME@
user=@USER@
environment=HOME="@HOME@",USER="@USER@"
autostart=true
autorestart=unexpected
; exit code 2 = configuration problem (e.g. network_cmd_enable off): supervisord
; retries a few times, then marks the program FATAL instead of looping forever.
exitcodes=0
startsecs=5
startretries=3
stopsignal=TERM
; a sync that is already running is allowed to finish before shutdown
stopwaitsecs=300
redirect_stderr=true
stdout_logfile=@HOME@/.local/state/romm-retroarch-sync/supervisor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
