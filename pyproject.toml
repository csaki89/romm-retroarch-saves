[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "romm-retroarch-saves"
version = "0.1.0"
description = "Headless two-way sync of RetroArch saves and save states with a RomM server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
romm-sync = "romm_sync.__main__:main"

[tool.setuptools]
packages = ["romm_sync"]
