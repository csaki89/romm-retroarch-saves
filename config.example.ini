[romm]
url = https://romm.example.com
; filled in by `romm-sync pair --url ... --code ...`
token = rmm_xxxxxxxxxxxxxxxxxxxx
; defaults to the hostname
; device_name = my-container

[retroarch]
saves_dir = ~/.var/app/org.libretro.RetroArch/config/retroarch/saves
states_dir = ~/.var/app/org.libretro.RetroArch/config/retroarch/states

[sync]
; newer  - the more recently modified side wins (ties keep local)
; local  - always keep the local file
; server - always keep the server file
conflict_policy = newer
; Before a download overwrites a local file, the old one is kept as
; <name>.bak-<timestamp>; this many backups are kept per file (0 = off).
backup_count = 3

[watch]
; used by `romm-sync watch`; needs network_cmd_enable = "true" in retroarch.cfg
enabled = true
; seconds between GET_STATUS polls (polling never syncs by itself)
poll_interval = 1
; seconds between syncs while RetroArch is running with no content loaded
idle_sync_interval = 900
; consecutive unanswered polls before RetroArch is considered stopped
failure_threshold = 3
udp_host = 127.0.0.1
udp_port = 55355
; retroarch.cfg to verify at startup (default: auto-detected next to saves_dir)
; retroarch_cfg = ~/.var/app/org.libretro.RetroArch/config/retroarch/retroarch.cfg

[logging]
; default: ~/.local/state/romm-retroarch-sync/sync.log
; file = ~/.local/state/romm-retroarch-sync/sync.log
level = INFO
